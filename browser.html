<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="themes/global.css">
</head>
<p id='topspacer'></p>
<div class="settings-menu">
	<div class="space-y-2 flex-col">
		<h1 style="margin-bottom: 0;">Menu</h1>
		<button width="100%" onclick="showHideSettings()" class="settings-button error-message">
			Close Menu
		</button>
		<button width="100%" onclick="dispachClearCache()" class="settings-button error-message">
			Clear cache and restart
		</button>
		<button width="100%" onclick="clearAllFavorites()" class="settings-button error-message">
			Clear all favorites
		</button>
		<button width="100%" onclick="setHome()" class="settings-button">
			Set As Homepage
		</button>
	</div>

	<div id="favoritesDiv">
		<h1>Favourites</h1>
		<ul></ul>
	</div>
</div>

<body class="flex-col">

	<div id="window-controls" style="display: none;">
		<div class="button" id="min-button">
			<img class="icon"
				srcset="icons/min-w-10.png 1x, icons/min-w-12.png 1.25x, icons/min-w-15.png 1.5x, icons/min-w-15.png 1.75x, icons/min-w-20.png 2x, icons/min-w-20.png 2.25x, icons/min-w-24.png 2.5x, icons/min-w-30.png 3x, icons/min-w-30.png 3.5x"
				draggable="false" />
		</div>
		<div class="button" id="max-button">
			<img class="icon"
				srcset="icons/max-w-10.png 1x, icons/max-w-12.png 1.25x, icons/max-w-15.png 1.5x, icons/max-w-15.png 1.75x, icons/max-w-20.png 2x, icons/max-w-20.png 2.25x, icons/max-w-24.png 2.5x, icons/max-w-30.png 3x, icons/max-w-30.png 3.5x"
				draggable="false" />
		</div>
		<div class="button" id="restore-button">
			<img class="icon"
				srcset="icons/restore-w-10.png 1x, icons/restore-w-12.png 1.25x, icons/restore-w-15.png 1.5x, icons/restore-w-15.png 1.75x, icons/restore-w-20.png 2x, icons/restore-w-20.png 2.25x, icons/restore-w-24.png 2.5x, icons/restore-w-30.png 3x, icons/restore-w-30.png 3.5x"
				draggable="false" />
		</div>
		<div class="button" id="close-button">
			<img class="icon"
				srcset="icons/close-w-10.png 1x, icons/close-w-12.png 1.25x, icons/close-w-15.png 1.5x, icons/close-w-15.png 1.75x, icons/close-w-20.png 2x, icons/close-w-20.png 2.25x, icons/close-w-24.png 2.5x, icons/close-w-30.png 3x, icons/close-w-30.png 3.5x"
				draggable="false" />
		</div>
	</div>

	<div id="nav-body-tabs"></div>

	<div id="nav-body-ctrls">
		<button id="fs-button" type="button" title="Set as Favorite" onclick="setFavorit()">
			<img class="nav-icon not-favourite" src="icons/favourite-no.png" />
			<img class="nav-icon favourite" src="icons/favourite-yes.png" />
		</button>
		<button id="fs-button" title="Mute/UnMute" onclick="onMute()">
			<img class="nav-icon mute" src="icons/mute.png" />
			<img class="nav-icon unmute" src="icons/unmute.png" />
		</button>
		<button id="fs-button" title="Show/Hide Settings" onclick="showSettings()">
			<img class="nav-icon" src="icons/settings-menu.png" />
		</button>
	</div>

	<div id="nav-body-views"></div>

	<script>
		const { ipcRenderer, remote } = require('electron');
		toggleFavouriteButton(window.location.href); // Initialize the favorite button state
		const Store = require('./store');
		const store = new Store({
			configName: 'user-preferences'
		});
		let home
		try {
			home = store.get('homepage');
		}
		catch (error) {
			home = null;
		}
		const enav = new (require('electron-navigation'))({
			defaultFavicons: true,
			newTabCallback: (url, options) => {
				options.postTabOpenCallback = webview => {
					webview.setAttribute('plugins', '');
				}
				return { options };
			}
		});

		// Keep address bar in sync with actual webview URL (including redirects)
		function updateAddressBar(url) {
			const input = document.getElementById('nav-ctrls-url');
			if (input) {
				try {
					input.value = url || input.value;
				} catch (e) {
					console.error('Failed to update address bar:', e);
				}
			}

			// Update suggestions and the favourites icon based on the current URL
			try { suggestFavorites(); } catch (e) { /* no-op if function not ready */ }
			toggleFavouriteButton(store.get('favorites')?.includes(input ? input.value : undefined));
		}

		function attachWebviewListeners(webview) {
			if (!webview) return;
			// Avoid attaching twice
			if (webview.__address_listeners_attached) return;
			webview.__address_listeners_attached = true;

			const copyUrlFromEvent = (event) => {
				let url = event && event.url ? event.url : null;
				if (!url && typeof webview.getURL === 'function') {
					try { url = webview.getURL(); } catch (e) { }
				}
				if (url) {
					updateAddressBar(url);
					toggleFavouriteButton(store.get('favorites')?.includes(url));
				};
			};

			webview.addEventListener('did-navigate', copyUrlFromEvent);
			webview.addEventListener('did-navigate-in-page', copyUrlFromEvent);
			webview.addEventListener('did-redirect-navigation', copyUrlFromEvent);
			webview.addEventListener('will-navigate', copyUrlFromEvent);
			webview.addEventListener('did-stop-loading', function () {
				copyUrlFromEvent({ url: (typeof webview.getURL === 'function' ? webview.getURL() : webview.getAttribute('src')) });
			});
		}

		// Attach to existing webviews
		const viewsContainer = document.getElementById('nav-body-views');
		if (viewsContainer) {
			Array.from(viewsContainer.querySelectorAll('webview')).forEach(attachWebviewListeners);

			// Observe for new webviews added by electron-navigation and attach listeners
			const mo = new MutationObserver(mutations => {
				for (const m of mutations) {
					for (const node of m.addedNodes) {
						if (node.tagName && node.tagName.toLowerCase() === 'webview') {
							attachWebviewListeners(node);
						}
					}
				}
			});
			mo.observe(viewsContainer, { childList: true, subtree: true });

			// Observe for tab/webview activation (class changes) to update address bar and suggestions
			const activeObserver = new MutationObserver(mutations => {
				for (const m of mutations) {
					if (m.type === 'attributes' && m.attributeName === 'class') {
						const t = m.target;
						if (t && t.classList && t.classList.contains('active')) {
							let url = '';
							try { url = (typeof t.getURL === 'function') ? t.getURL() : t.getAttribute('src'); } catch (e) { }
							if (url) updateAddressBar(url);
							suggestFavorites();
							toggleFavouriteButton(store.get('favorites')?.includes(url));
						}
					}
				}
			});
			activeObserver.observe(viewsContainer, { subtree: true, attributes: true, attributeFilter: ['class'] });
		}

		// Replace injected add-tab icon element with our PNG when it appears
		function replaceAddTabIcon(el) {
			if (!el) return;
			try {
				// if already replaced, skip
				if (el.__custom_add_icon) return;
				el.__custom_add_icon = true;
				// remove any existing children (SVG or text)
				while (el.firstChild) el.removeChild(el.firstChild);
				const img = document.createElement('img');
				img.src = 'icons/add.png';
				img.alt = 'Add tab';
				img.draggable = false;
				img.className = 'add-tab-button';
				el.appendChild(img);
				el.style.background = 'transparent';
				el.style.padding = '4px';
			} catch (e) {
				console.error('replaceAddTabIcon error', e);
			}
		}

		// immediate replace if already present
		const existingAdd = document.getElementById('nav-tabs-add');
		if (existingAdd) replaceAddTabIcon(existingAdd);

		// watch for injected add button
		const addObserver = new MutationObserver(mutations => {
			for (const m of mutations) {
				for (const n of m.addedNodes) {
					if (!n) continue;
					if (n.id === 'nav-tabs-add') replaceAddTabIcon(n);
					else if (n.querySelector) {
						const found = n.querySelector('#nav-tabs-add');
						if (found) replaceAddTabIcon(found);
					}
				}
			}
		});
		addObserver.observe(document.body, { childList: true, subtree: true });

		function toggleFullscreen(event) {
			if (event.key === 'Escape') {
				ipcRenderer.send('fullScreen-click');
				isFullScreen = false;
				header.style.display = oldStyle;

				tabs.style.display = oldStyle1;
				nav.style.display = oldStyle2;
				topspacer.style.display = oldStyle3;
			}
			if (event.type === 'click') {
				ipcRenderer.send('fullScreen-click');
			}
			if (event.key === 'F11' || event.type === 'click') {
				isFullScreen = !isFullScreen;
				header.style.display = isFullScreen ? "none" : oldStyle;
				tabs.style.display = isFullScreen ? "none" : oldStyle1;
				nav.style.display = isFullScreen ? "none" : oldStyle2;
				topspacer.style.display = isFullScreen ? "none" : oldStyle3;
			}
		}

		function exitFullScreen(e) {
			isFullScreen = false;
			header.style.display = oldStyle;

			tabs.style.display = oldStyle1;
			nav.style.display = oldStyle2;
			topspacer.style.display = oldStyle3;
		}

		let nav = document.getElementById('nav-body-ctrls');
		let tabs = document.getElementById('nav-body-tabs');
		let header = document.getElementById('window-controls');
		let topspacer = document.getElementById('topspacer');

		let controls = document.getElementById('nav-body-ctrls');
		let oldStyle = getComputedStyle(header).display;
		let oldStyle1 = getComputedStyle(tabs).display;
		let oldStyle2 = getComputedStyle(nav).display;
		let oldStyle3 = getComputedStyle(topspacer).display;

		var length = window.process.argv.length;
		var lastArgument = window.process.argv[length - 1]
		if (lastArgument && lastArgument.indexOf("file:///") == 0) {
			console.log(lastArgument);
			enav.newTab(lastArgument, {
				title: 'Local file'
			})
		}
		else if (home) {
			enav.newTab(home, { icon: "icons/restore-w-24.png" })
		}
		else {
			enav.newTab('https://www.google.com/', { icon: "clear" });
		}

		function getFavorites() {
			const mainProcess = remote.require('./index');
			let favs = mainProcess.getFavorites();

			const favsDiv = document.getElementById('favoritesDiv');

			if (favs.length === 0) {
				let noFavsMessage = document.createElement('p');
				noFavsMessage.textContent = 'No favorites set.';
				favsDiv.innerHTML = "<h1>Favourites</h1>";
				favsDiv.appendChild(noFavsMessage);
				return;
			}

			// Render the list using DOM nodes (preserve event listeners)
			favsDiv.innerHTML = "<h1>Favourites</h1>";
			favsDiv.appendChild(makeUL(favs));
		}

		getFavorites();

		function setFavorit(event) {
			try {
				// SECURITY: Sanitize URL input before setting as favorite
				let favURL = document.getElementById('nav-ctrls-url').value;

				// Basic URL validation
				if (!favURL || favURL.trim() === '') {
					console.warn('Empty URL provided');
					return;
				}

				// Sanitize and validate URL format
				favURL = favURL.trim();
				if (!/^[a-zA-Z]+:\/\//.test(favURL)) {
					favURL = 'https://' + favURL;
				}

				try {
					favURL = new URL(favURL).href;
				} catch (urlError) {
					console.warn('Invalid URL format:', favURL);
					return;
				}

				if (!favURL.match(/^(https?:\/\/|file:\/\/\/)/i)) {
					console.warn('Invalid URL protocol:', favURL);
					return;
				}

				const mainProcess = remote.require('./index');
				const isAdded = mainProcess.toggleFavorite(favURL);
				getFavorites(); // Refresh the favorites list after adding
				toggleFavouriteButton(isAdded);
			} catch (error) {
				console.error('Error setting favorite:', error);
			}
		}

		function toggleFavouriteButton(isFavorite) {
			const favIcon = document.querySelector('.nav-icon.favourite');
			const notFavIcon = document.querySelector('.nav-icon.not-favourite');
			if (isFavorite) {
				favIcon.style.display = 'inline';
				notFavIcon.style.display = 'none';
			} else {
				favIcon.style.display = 'none';
				notFavIcon.style.display = 'inline';
			}
		}

		function setHome(event) {
			try {
				// SECURITY: Sanitize URL input before setting as homepage
				let homeURL = document.getElementById('nav-ctrls-url').value;

				// Basic URL validation
				if (!homeURL || homeURL.trim() === '') {
					console.warn('Empty URL provided');
					return;
				}

				// Sanitize and validate URL format
				homeURL = homeURL.trim();
				if (!homeURL.match(/^(https?:\/\/|file:\/\/\/)/i)) {
					console.warn('Invalid URL protocol:', homeURL);
					return;
				}

				const mainProcess = remote.require('./index');
				mainProcess.sethome(homeURL);
			} catch (error) {
				console.error('Error setting homepage:', error);
			}
		}

		var isWin = window.process.platform === "win32";
		if (isWin) {
			var windowsControls = document.getElementById('window-controls');
			windowsControls.style = "display: true;";
			console.log(2233)
		}
		else {
			document.getElementById('nav-body-tabs').style = "padding-left: 5rem;";
			//document.getElementById('nav-body-tabs').addEventListener("dblclick", handleDoubleClick);
			document.getElementById('topspacer').addEventListener("dblclick", handleDoubleClick);
		}

		// Mute button
		function onMute(muted) {
			const webview = document.querySelector('.nav-views-view.active');
			if (webview) {
				if (webview.audioMuted || !muted) {
					webview.audioMuted = false;
					document.querySelector('.nav-icon.mute').style.display = 'none';
					document.querySelector('.nav-icon.unmute').style.display = 'inline';
				}
				else {
					webview.audioMuted = true;
					document.querySelector('.nav-icon.mute').style.display = 'inline';
					document.querySelector('.nav-icon.unmute').style.display = 'none';
				}
			}
		}

		// Clear Cache Button
		function dispachClearCache(event) {
			ipcRenderer.send('clearChache-click');
		}

		// Clear Favorites Button
		function clearAllFavorites(event) {
			try {
				const mainProcess = remote.require('./index.js');
				mainProcess.removeAllFav();
				getFavorites(); // Refresh the favorites list after clearing
				console.log("Cleaned favorites")
			} catch (error) {
				console.error('Error clearing favorites:', error);
			}
		}

		// Settings Button
		function showSettings(event) {
			try {
				const mainProcess = remote.require('./index');
				mainProcess.showSettings();
			} catch (error) {
				console.error('Error showing settings:', error);
			}
		}

		function handleDoubleClick(event) {
			try {
				const doubleClickAction = remote.systemPreferences.getUserDefault('AppleActionOnDoubleClick', 'string');
				const win = remote.getCurrentWindow();
				if (doubleClickAction === 'Minimize') {
					win.minimize();
				} else if (doubleClickAction === 'Maximize') {
					if (!win.isMaximized()) {
						win.maximize();
					} else {
						win.unmaximize();
					}
				}
			} catch (error) {
				console.error('Error handling double click:', error);
			}
		}

		function openInNewTab(e) {
			e.preventDefault();
			enav.newTab(e.target.href);
			toggleFavouriteButton(store.get('favorites')?.includes(e.target.href));
		}

		var div = document.querySelector('.settings-menu');
		require('electron').ipcRenderer.on('ping', showHideSettings);
		require('electron').ipcRenderer.on('Esc', exitFullScreen);


		function showHideSettings(event, message, refresh) {
			var settingsMenuDiv = document.querySelector('.settings-menu');
			if (!settingsMenuDiv) {
				return;
			}

			var isOpen = settingsMenuDiv.classList.contains('open');

			if (refresh && message) {
				getFavorites();
				settingsMenuDiv.classList.add('open');
				return;
			}

			settingsMenuDiv.classList.toggle('open', !isOpen);
		}


		function makeUL(array) {

			// Create the list element:
			var list = document.createElement('ul');
			if (array == null) { array = new Array() }
			for (var i = 0; i < array.length; i++) {
				// Create the list item:
				var item = document.createElement('li');
				item.className = "space-x-2 flex-row";
				if (typeof array[i] === 'string') {
					var a = document.createElement('a')
					a.text = array[i];
					a.href = array[i]
					a.onclick = openInNewTab;

					let btn = document.createElement("button");
					btn.innerHTML = "Remove";
					btn.id = array[i];
					btn.onclick = function (event) {
						try {
							const mainProcess = remote.require('./index');
							mainProcess.removeFav(event.target.id);
							getFavorites(); // Refresh the favorites list after removal
							toggleFavouriteButton(store.get('favorites')?.includes(event.target.id)); // Update the favorite button state
						} catch (error) {
							console.error('Error removing favorite:', error);
						}
					};

					item.appendChild(a);
					item.appendChild(btn);

					// Add it to the list:
					list.appendChild(item);
				}
			}

			// Finally, return the constructed list:
			return list;
		}

		// Suggest nav bar
		let navBar = document.getElementById('nav-ctrls-url');
		if (navBar) navBar.addEventListener('keyup', suggestFavorites);

		function suggestFavorites(e) {
			let listFavorites = store.get('favorites') || [];
			if (!listFavorites.length) return;

			let inputText = navBar ? navBar.value : '';
			let deURL;

			for (var i = 0; i < listFavorites.length; i++) {
				deURL = listFavorites[i].replace(/(^\w+:|^)\/\//, '');
				deURL = deURL.replace("www.", "");
				if (!deURL) continue;

				if (e && (e.keyCode === 8 || e.keyCode === 17 || e.ctrlKey)) continue;

				if (deURL !== inputText && deURL.indexOf(inputText) === 0) {
					try {
						navBar.value = deURL;
						if (e) navBar.setSelectionRange(inputText.length, 999);
					} catch (err) {
						console.error('Error suggesting favorite:', err);
					}
					break;
				}
			}
		}

		// Find on Page	
		let finInwebview = document.getElementById('nav-body-views').getElementsByClassName("active")[0];
		let findInPage;

		try {
			const FindInPage = require('electron-find').FindInPage;
			findInPage = new FindInPage(remote.getCurrentWebContents(), {
				parentElement: document.querySelector('#nav-body-views'), offsetTop: 70, boxBgColor: '#000000', boxShadowColor: '#111111'
			});
		} catch (error) {
			console.error('Error initializing FindInPage:', error);
		}

		ipcRenderer.on('on-find', (e, args) => {
			try {
				if (findInPage) {
					findInPage.openFindWindow();
					console.log(223 + document.querySelector('#nav-body-views'));
				}
			} catch (error) {
				console.error('Error opening find window:', error);
			}
		})

		// Promote on last tab close:
		let closeTabBtns = document.getElementsByClassName("nav-tabs-tab")[0];
		closeTabBtns.addEventListener('click', closeTab);

		function closeTab(e) {
			console.log("CLOSE A#" + document.getElementsByClassName('nav-tabs-tab').length);
			if (document.getElementsByClassName('nav-tabs-tab').length == 1) {
				enav.newTab('https://www.google.com', {
					close: false,
					icon: enav.TAB_ICON,
				});
			}
		};

		onMute(false); // Initialize the mute button state

	</script>
</body>

</html>
